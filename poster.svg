      <ellipse cx="160" cy="530" rx="190" ry="42" fill="#ff234c" fill-opacity=".22" filter="url(#soft)"/>
      <path d="M157 92 L214 125 L238 199 L216 244 L102 244 L81 198 L104 124Z" fill="url(#armorDark)" stroke="#dce8ff" stroke-width="5"/>
      <path d="M104 132 L154 102 L208 132 L191 184 L121 184Z" fill="#10192b" stroke="#ff4a67" stroke-width="4"/>
      <path d="M129 139 L154 127 L180 139 L174 165 L137 165Z" fill="#52e5ff" filter="url(#glowCyan)"/>
      <path d="M114 112 L132 74 L157 48 L184 76 L201 112 L183 128 L129 128Z" fill="url(#armor)" stroke="#eff6ff" stroke-width="5"/>
      <path d="M130 87 L155 65 L181 88 L176 119 L137 119Z" fill="#09111e"/>
      <path d="M153 67 L155 42 L163 67" fill="none" stroke="#ff4767" stroke-width="6"/>
      <path d="M95 188 L39 238 L60 330 L110 301" fill="url(#armorDark)" stroke="#b8c8de" stroke-width="5"/>
      <path d="M217 188 L273 238 L252 330 L202 301" fill="url(#armorDark)" stroke="#b8c8de" stroke-width="5"/>
      <path d="M101 244 L208 244 L231 389 L202 466 L108 466 L79 389Z" fill="url(#armor)" stroke="#e7eef8" stroke-width="6"/>
      <path d="M124 273 L186 273 L196 359 L155 390 L114 359Z" fill="#0c1527" stroke="#ff4767" stroke-width="4"/>
      <circle cx="155" cy="326" r="18" fill="#ff3a5c" filter="url(#glowRed)"/>
      <path d="M108 465 L152 465 L145 652 L89 652Z" fill="url(#armorDark)" stroke="#cbd8ea" stroke-width="5"/>
      <path d="M158 465 L202 465 L222 652 L166 652Z" fill="url(#armorDark)" stroke="#cbd8ea" stroke-width="5"/>
      <path d="M88 651 L148 651 L136 693 L72 693Z" fill="#080b13" stroke="#ff4968" stroke-width="4"/>
      <path d="M167 651 L224 651 L245 693 L181 693Z" fill="#080b13" stroke="#ff4968" stroke-width="4"/>
      <!-- guided tracks -->
      <path d="M300 118 C351 175 327 233 274 275" fill="none" stroke="#ff3d5e" stroke-width="5" stroke-dasharray="10 12" filter="url(#glowRed)"/>
      <path d="M22 120 C-33 181 -9 240 40 275" fill="none" stroke="#50e4ff" stroke-width="5" stroke-dasharray="10 12" filter="url(#glowCyan)"/>
      <path d="M155 18 V-25" stroke="#fff" stroke-width="4" filter="url(#glowCyan)"/>
      <text x="4" y="755" fill="#ff8497" font-size="17">稳定落地 = 新重量被身体承认</text>
    </g>

    <!-- chant rail -->
    <g transform="translate(74 1275)">
      <text x="0" y="0" fill="#ff4d69" font-size="18" letter-spacing="3">04 / SYSTEM CHANT</text>
