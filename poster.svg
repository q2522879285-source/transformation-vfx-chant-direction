<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03040b"/><stop offset="0.48" stop-color="#0b1020"/><stop offset="1" stop-color="#17060e"/></linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="44%" r="58%"><stop offset="0" stop-color="#ff324f" stop-opacity=".36"/><stop offset=".45" stop-color="#8d1736" stop-opacity=".14"/><stop offset="1" stop-color="#090913" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyanGlow" cx="58%" cy="48%" r="46%"><stop offset="0" stop-color="#39e5ff" stop-opacity=".22"/><stop offset=".6" stop-color="#0f6a9a" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#ff516c" stop-opacity=".75"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset=".72" stop-color="#43dcff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7edf4"/><stop offset=".42" stop-color="#6d778c"/><stop offset=".62" stop-color="#1e2636"/><stop offset="1" stop-color="#05070d"/></linearGradient>
    <linearGradient id="armorDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#313c53"/><stop offset=".55" stop-color="#0b0f1c"/><stop offset="1" stop-color="#010208"/></linearGradient>
    <linearGradient id="redMetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7c87"/><stop offset=".35" stop-color="#db1e3f"/><stop offset="1" stop-color="#52051e"/></linearGradient>
    <filter id="glowRed" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/></pattern>
    <pattern id="micro" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".12"/></pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <rect width="1080" height="1920" fill="url(#micro)" opacity=".45"/>
  <ellipse cx="520" cy="830" rx="460" ry="620" fill="url(#redGlow)"/>
  <ellipse cx="720" cy="930" rx="430" ry="580" fill="url(#cyanGlow)"/>
  <path d="M75 340H1005 M75 342H1005" stroke="#e83c58" stroke-opacity=".35"/>
  <path d="M80 1500H1000" stroke="#58dcff" stroke-opacity=".18"/>
  <path d="M120 120L960 1800 M960 120L120 1800" stroke="#fff" stroke-opacity=".028" stroke-width="2"/>

  <g font-family="Noto Sans SC">
    <text x="78" y="92" fill="#9ba9c6" font-size="18" letter-spacing="5">TRANSFORMATION / VFX / CHANT DIRECTION</text>
    <text x="78" y="132" fill="#fff" font-size="14" letter-spacing="3" opacity=".55">原创英雄变身设计法 · OPEN SOURCE EDITION</text>
    <rect x="836" y="70" width="166" height="46" rx="23" fill="#ff2548" fill-opacity=".12" stroke="#ff4a66" stroke-width="1"/>
    <text x="919" y="99" text-anchor="middle" fill="#ff8c9d" font-size="15" letter-spacing="2">MIT / FREE USE</text>

    <text x="78" y="256" fill="#eaf2ff" font-size="52" font-weight="700" letter-spacing="6">当决心回应力量</text>
    <text x="80" y="310" fill="#95a4be" font-size="22" letter-spacing="3">不是穿上装甲，而是让守护的选择被世界听见</text>
    <path d="M80 350H1000" stroke="#eaf2ff" stroke-opacity=".25"/>
    <path d="M80 350H356" stroke="#ff3d5e" stroke-width="4"/>

    <!-- left emotional arc -->
    <g transform="translate(74 405)">
      <text x="0" y="0" fill="#ff4d69" font-size="18" letter-spacing="3">01 / HUMAN BASELINE</text>
      <text x="0" y="44" fill="#fff" font-size="32" font-weight="700">恐惧 · 犹豫 · 呼吸</text>
      <text x="0" y="78" fill="#96a4bb" font-size="18">先让观众看见“普通人”</text>
      <path d="M0 106H305" stroke="#ff4d69" stroke-opacity=".6"/>
      <!-- person shielding a small protected subject -->
      <circle cx="102" cy="191" r="36" fill="#11182a" stroke="#dce8ff" stroke-width="5"/>
      <path d="M68 252 Q100 216 134 252 L150 376 Q102 404 54 376Z" fill="#192236" stroke="#9bb1d0" stroke-width="5"/>
      <path d="M68 277 L14 333" stroke="#9bb1d0" stroke-width="16" stroke-linecap="round"/>
      <path d="M136 276 L198 329" stroke="#9bb1d0" stroke-width="16" stroke-linecap="round"/>
      <path d="M84 374 L62 474 M122 374 L145 474" stroke="#7f91af" stroke-width="17" stroke-linecap="round"/>
      <circle cx="205" cy="363" r="24" fill="#ffcc92" fill-opacity=".88"/>
      <path d="M205 389 Q178 420 182 468 M205 389 Q232 420 228 468" fill="none" stroke="#ffcc92" stroke-width="13" stroke-linecap="round"/>
      <path d="M24 521 C90 489 170 492 248 523" fill="none" stroke="#ff3d5e" stroke-width="3" stroke-dasharray="8 12"/>
      <text x="0" y="565" fill="#ff9aab" font-size="15">动作先于口号：挡在危险与被保护者之间</text>
    </g>

    <!-- decision arrow -->
    <g transform="translate(420 525)">
      <path d="M0 78 H172" stroke="#ff3d5e" stroke-width="4"/>
      <path d="M153 57 L181 78 L153 99" fill="none" stroke="#ff3d5e" stroke-width="4"/>
      <text x="0" y="38" fill="#fff" font-size="22" letter-spacing="3">决定不是台词</text>
      <text x="0" y="130" fill="#ff8da0" font-size="18">是身体移动后的承诺</text>
    </g>

    <!-- core / transformation callout -->
    <g transform="translate(412 690)">
      <circle cx="132" cy="132" r="132" fill="none" stroke="#ff3458" stroke-opacity=".28" stroke-width="2"/>
      <circle cx="132" cy="132" r="102" fill="none" stroke="#52dfff" stroke-opacity=".38" stroke-width="2" stroke-dasharray="8 14"/>
      <circle cx="132" cy="132" r="55" fill="#0b1020" stroke="#ff4969" stroke-width="4" filter="url(#glowRed)"/>
      <path d="M132 88 L145 122 L181 132 L145 143 L132 180 L119 143 L83 132 L119 122Z" fill="#f9fbff" filter="url(#glowCyan)"/>
      <text x="132" y="280" text-anchor="middle" fill="#ff8a9d" font-size="18" letter-spacing="4">02 / POWER ANSWERS</text>
      <text x="132" y="330" text-anchor="middle" fill="#fff" font-size="66" font-weight="700" letter-spacing="8">変身！</text>
      <text x="132" y="370" text-anchor="middle" fill="#aab9d0" font-size="17" letter-spacing="2">真人只喊一次 · 清楚口型 · 留一口气</text>
    </g>

    <!-- energy beam -->
    <rect x="536" y="1040" width="8" height="380" fill="url(#beam)" filter="url(#glowRed)"/>
    <g stroke="#5be3ff" stroke-opacity=".35" fill="none">
      <circle cx="540" cy="1220" r="208" stroke-width="2" stroke-dasharray="12 22"/>
      <circle cx="540" cy="1220" r="270" stroke-width="1" stroke-dasharray="4 18"/>
    </g>

    <!-- armored hero -->
    <g transform="translate(688 730)">
      <text x="0" y="0" fill="#52ddff" font-size="18" letter-spacing="3">03 / FORMATION</text>
      <text x="0" y="42" fill="#fff" font-size="30" font-weight="700">装甲不是贴上去</text>
      <text x="0" y="76" fill="#a7b7cf" font-size="18">每个模块都有来源、路径、锁定与后果</text>
