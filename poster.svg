      <text x="0" y="76" fill="#9eacc2" font-size="18">机械声独立于真人；不重复“変身”</text>
      <g transform="translate(0 112)">
        <rect x="0" y="0" width="932" height="70" rx="12" fill="#11182a" stroke="#ff4968" stroke-opacity=".55"/>
        <circle cx="35" cy="35" r="17" fill="#ff3d5e"/><text x="35" y="41" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">01</text>
        <text x="75" y="33" fill="#fff" font-size="23" font-weight="700">コア・アウェイク！</text><text x="75" y="56" fill="#ff9cab" font-size="14" letter-spacing="2">CO-re A-WAKE · 核心回应决心</text>
        <path d="M730 35 H884" stroke="#ff4968" stroke-width="3"/><circle cx="900" cy="35" r="6" fill="#ff4968"/>
      </g>
      <g transform="translate(0 194)">
        <rect x="0" y="0" width="932" height="70" rx="12" fill="#0e1a2a" stroke="#52ddff" stroke-opacity=".6"/>
        <circle cx="35" cy="35" r="17" fill="#52ddff"/><text x="35" y="41" text-anchor="middle" fill="#06101d" font-size="16" font-weight="700">02</text>
        <text x="75" y="33" fill="#fff" font-size="23" font-weight="700">ガード・パルス！</text><text x="75" y="56" fill="#81eaff" font-size="14" letter-spacing="2">GUARD PULSE · 守护脉冲扩张</text>
        <path d="M730 35 H884" stroke="#52ddff" stroke-width="3"/><circle cx="900" cy="35" r="6" fill="#52ddff"/>
      </g>
      <g transform="translate(0 276)">
        <rect x="0" y="0" width="932" height="70" rx="12" fill="#11182a" stroke="#ff4968" stroke-opacity=".55"/>
        <circle cx="35" cy="35" r="17" fill="#ff3d5e"/><text x="35" y="41" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">03</text>
        <text x="75" y="33" fill="#fff" font-size="23" font-weight="700">アーマー・スライド！</text><text x="75" y="56" fill="#ff9cab" font-size="14" letter-spacing="2">ARMOR SLIDE · 模块沿轨道进入</text>
        <path d="M730 35 H884" stroke="#ff4968" stroke-width="3"/><circle cx="900" cy="35" r="6" fill="#ff4968"/>
      </g>
      <g transform="translate(0 358)">
        <rect x="0" y="0" width="932" height="70" rx="12" fill="#0e1a2a" stroke="#52ddff" stroke-opacity=".6"/>
        <circle cx="35" cy="35" r="17" fill="#52ddff"/><text x="35" y="41" text-anchor="middle" fill="#06101d" font-size="16" font-weight="700">04</text>
        <text x="75" y="33" fill="#fff" font-size="23" font-weight="700">ロック・シーケンス！</text><text x="75" y="56" fill="#81eaff" font-size="14" letter-spacing="2">LOCK SEQUENCE · 关节锁止爆发</text>
        <path d="M730 35 H884" stroke="#52ddff" stroke-width="3"/><circle cx="900" cy="35" r="6" fill="#52ddff"/>
      </g>
      <g transform="translate(0 440)">
        <rect x="0" y="0" width="932" height="70" rx="12" fill="#171322" stroke="#ff4968" stroke-opacity=".7"/>
        <circle cx="35" cy="35" r="17" fill="#ff3d5e"/><text x="35" y="41" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">05</text>
        <text x="75" y="33" fill="#fff" font-size="23" font-weight="700">コンプリート・ガーディアン！</text><text x="75" y="56" fill="#ff9cab" font-size="14" letter-spacing="2">COMPLETE GUARDIAN · 完成形确认</text>
        <path d="M730 35 H884" stroke="#ff4968" stroke-width="3"/><circle cx="900" cy="35" r="6" fill="#ff4968"/>
      </g>
    </g>

    <!-- finish -->
    <g transform="translate(74 1810)">
      <path d="M0 0H932" stroke="#fff" stroke-opacity=".22"/>
      <text x="0" y="44" fill="#fff" font-size="24" font-weight="700">05 / AFTERMATH</text>
      <text x="0" y="80" fill="#ff8497" font-size="17">一次冲击环 · 一次环境回应 · 然后让余波衰减</text>
      <text x="932" y="48" text-anchor="end" fill="#b9c9df" font-size="17">保护对象安全 · 骑士稳定站定</text>
      <text x="0" y="112" fill="#53e4ff" font-size="15" letter-spacing="0.6">github.com/q2522879285-source/transformation-vfx-chant-direction</text>
    </g>
